[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
Draggable=1
SnapEdges=1
KeepOnScreen=1
BackgroundMode=2
SolidColor=0,0,0,1

[Metadata]
Name=今天摸了吗
Author=Shu1nm LLC
Version=1.0
Information=实时显示「今日混底薪【工资】」与「已摸鱼时长」。需先运行「今天摸了吗」主程序，它会每秒把数据写到本目录的 widget.txt。

[Variables]
CardW=286
CardH=148
FontCN=Microsoft YaHei UI
FontNum=Consolas
TextMain=255,255,255,255
TextMuted=188,196,222,255
MoneyColor=255,150,105,255
TimeColor=160,178,255,255

; ---- 读取主程序实时输出的 4 行文本：金额 / 时长 / 状态 / 倒计时 ----
[MeasureLines]
Measure=WebParser
Url=file:///#CURRENTPATH#widget.txt
CodePage=65001
RegExp=(?s)^(.*?)\R(.*?)\R(.*?)\R(.*?)\R?$
UpdateRate=1
FinishAction=[!UpdateMeter *][!Redraw]

[MeasureMoney]
Measure=WebParser
Url=[MeasureLines]
StringIndex=1

[MeasureDuration]
Measure=WebParser
Url=[MeasureLines]
StringIndex=2

[MeasureStatus]
Measure=WebParser
Url=[MeasureLines]
StringIndex=3

[MeasureCountdown]
Measure=WebParser
Url=[MeasureLines]
StringIndex=4

; ---- 外观：半透明深色磨砂卡片 ----
[MeterBackground]
Meter=Shape
X=0
Y=0
Shape=Rectangle 0,0,#CardW#,#CardH#,16 | Fill Color 35,41,69,216 | StrokeWidth 0
Shape2=Rectangle 0,0,#CardW#,3,2 | Fill Color 255,140,100,220 | StrokeWidth 0

[MeterTitle]
Meter=String
X=17
Y=13
FontFace=#FontCN#
FontSize=11
StringStyle=Bold
FontColor=#TextMuted#
AntiAlias=1
Text=◉ 今天摸了吗

[MeterLabel1]
Meter=String
X=17
Y=36
FontFace=#FontCN#
FontSize=10
FontColor=#TextMuted#
AntiAlias=1
Text=今日混底薪【工资】

[MeterMoney]
Meter=String
MeasureName=MeasureMoney
X=17
Y=51
FontFace=#FontNum#
FontSize=27
StringStyle=Bold
FontColor=#MoneyColor#
AntiAlias=1
Text=¥%1

[MeterLabel2]
Meter=String
X=17
Y=96
FontFace=#FontCN#
FontSize=10
FontColor=#TextMuted#
AntiAlias=1
Text=已摸鱼时长

[MeterDuration]
Meter=String
MeasureName=MeasureDuration
X=136
Y=93
FontFace=#FontNum#
FontSize=15
StringStyle=Bold
FontColor=#TimeColor#
AntiAlias=1
Text=%1

[MeterStatus]
Meter=String
MeasureName=MeasureStatus
X=17
Y=124
FontFace=#FontCN#
FontSize=9
FontColor=#TextMuted#
AntiAlias=1
Text=%1

[MeterCountdown]
Meter=String
MeasureName=MeasureCountdown
X=110
Y=124
FontFace=#FontCN#
FontSize=9
FontColor=#TextMuted#
AntiAlias=1
Text=%1
